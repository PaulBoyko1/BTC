name: Verify and Materialize Crypto Interval Analyzer

on:
  pull_request:
    branches: [main]
    paths:
      - ".interval-import/**"
      - ".github/workflows/materialize-interval-analyzer.yml"

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify transport and reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/interval-chunks.sha256 <<'EOF'
          beb91612057acaef716b0ffc0d2e579b8c9a0bb03c34ede30064cfa15957b301  .interval-import/part-00-0
          8147a9b1a15d599247fd93f4225ad3a8042763f4438776c7f79e9d8e7196a8a2  .interval-import/part-00-1
          555ea1a0f7881adbc54ff5b98607141a84d4bcf2dd2680bd71ff4235178cbdb1  .interval-import/part-00-2
          e3aa3781e6d62793369f6468ec10f6bb6795c538203567ed10c1acc8b606c5eb  .interval-import/part-01
          196a416f39c5b1cbc56b1de8c1b21ee408cca4f8203cebb7d43bf661ad816898  .interval-import/part-02
          51cb3d21a7168422d899e95086255fa7d0efc0fc746979d266be254843580007  .interval-import/part-03
          cf325c62ab2241d074151d6c5076a4136488c67a87bc88283a2ae35c22d300ae  .interval-import/part-04
          a03069853b67afb6ee69631daa9804d06ed12d15702318c4a85e37d585ef4729  .interval-import/part-05
          2a9fb337a96983f5c4c7e36638f17a83248edbc1321ab8d30228e9c4beaef108  .interval-import/part-06
          37810e21e7125c5eef834e0a3df1db3a9363044a17bbfb74326a1b50949077a5  .interval-import/part-07
          3e2fdcd3256383e7823cdeaa3741080aface3fe494961333c7de3d03173cd62f  .interval-import/part-08
          4db57a72ccced3f35df7755d8b2d38a15be7d2cba5889f6c43cfc870043ae19a  .interval-import/part-09
          bdb60c0b23858b66a5450228982237c888a94efc58f72de35839df3aec1ad8d0  .interval-import/part-10
          EOF
          sha256sum --check /tmp/interval-chunks.sha256
          cat .interval-import/part-00-0 .interval-import/part-00-1 .interval-import/part-00-2 > /tmp/part-00
          echo "b42d1dfe870f801b346ef4454e7f3b60905e9900895ecdb87e6572da04f3166a  /tmp/part-00" | sha256sum --check
          cat /tmp/part-00 \
            .interval-import/part-01 \
            .interval-import/part-02 \
            .interval-import/part-03 \
            .interval-import/part-04 \
            .interval-import/part-05 \
            .interval-import/part-06 \
            .interval-import/part-07 \
            .interval-import/part-08 \
            .interval-import/part-09 \
            .interval-import/part-10 \
            > /tmp/interval-update.b64x2
          echo "69609a2b6c6ab75b5b53a4f016efa2f6f818e4da3a2fb9387e583aa62c067365  /tmp/interval-update.b64x2" | sha256sum --check
          base64 --decode /tmp/interval-update.b64x2 > /tmp/interval-update.b64
          echo "297243b6fb7d3a11907b245ba07388a516d1a401eff04d4cefbef53fef59c5b0  /tmp/interval-update.b64" | sha256sum --check
          base64 --decode /tmp/interval-update.b64 > /tmp/interval-update.tar.xz
          echo "4ad2e2cf054a495258f92989ccf5a5829c4cb6adddd7c6339b94348ecc3e2a6f  /tmp/interval-update.tar.xz" | sha256sum --check
          tar -xJf /tmp/interval-update.tar.xz
          git checkout HEAD -- .github/workflows/research-lab-ci.yml

      - name: Verify frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build

      - name: Verify backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/interval \
            backend/app/interval_main.py \
            backend/migrations/002_crypto_interval_analyzer.sql \
            backend/tests/test_interval.py \
            interval.html \
            interval.css \
            src/interval.ts \
            dist/interval.js
          git commit -m "Add Crypto Interval Analyzer foundation"
          git push origin HEAD:${{ github.head_ref }}
