name: Materialize Strategy Research Lab

on:
  push:
    branches: [feature/strategy-research-validation-lab]
    paths:
      - ".research-import/ready"

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/strategy-research-validation-lab
          fetch-depth: 0

      - name: Verify transport and reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/research-chunks.sha256 <<'EOF'
          e83a0e87dee57343da78bec655ae2f71d44fb5a7f2145de756bd56bcf089f3b2  .research-import/part-00
          c7bcbaa87b45897b733ff40a5952023927f5a106d22354e0e37755a9a6285bc0  .research-import/part-01
          4893fe60bbb81f4671ae2adc81f8936cb83c6692a79dce49892c9d699c1b55a0  .research-import/part-02
          07203b43586d295f8bb195d269cd9bf33a6b93c00f3b6156f7f4a30dc25e98fe  .research-import/part-03
          7e5e6f3a2387d23cc5167f652255ecf1e174d3457e055422612e4629822fb1d7  .research-import/part-04
          050f607c1019855e5c027d40acd90d051bd36d5bd2e79b4e009a7ad0c4e5eef7  .research-import/part-05
          b121bdb30e9de06d848bcc6a12c648eee10ba79bc8ced2f79104eb796aeb69c0  .research-import/part-06
          83ffda4916dd9141b29eea7b299ebfbab61c4348b48bcfcaa02f24329f029097  .research-import/part-07
          00b98fff8be2405a461e970e1c673a24b604b9a7759f541dd14d897c32a9d3be  .research-import/part-08
          162928cfc75246ead07082de90298fb831aaa4598613314c69e9d0fcd936d501  .research-import/part-09
          ba220d0f09b9ef16f1ce578c0897b4f00544f0e3089e372330843a804c019b74  .research-import/part-10
          aa47acd8590368c06654efddf34995a4ab7a6e34610ddf74058f230ada20c914  .research-import/part-11
          f28c0860710697f439f1b0583344530bfa68ba84c5d79e2f1d25ddcca56dc45f  .research-import/part-12
          31f2c15ebf02541c95bc4e652758c23d6c611fe3c08c28f05a28bf2411fb6065  .research-import/part-13
          6c28d443b899118f1b4af3ddbff5f15de710298008afe32b466bea0b55567bf7  .research-import/part-14
          dd2ee072fd8c4a4c012c61cfc70c2f33f90c7447ce71ab2d95df447c3ce3b282  .research-import/part-15
          EOF
          sha256sum --check /tmp/research-chunks.sha256
          cat .research-import/part-* > /tmp/research-lab.b64x2
          echo "00823ad44dc60370cea0d915e868865b34a7f726523ccd8c52911a6ad06532ed  /tmp/research-lab.b64x2" | sha256sum --check
          base64 --decode /tmp/research-lab.b64x2 > /tmp/research-lab.b64
          echo "2e2c0e2f7e71c9f8528cb50fbe4879737f91d005ae150ac77410ead17f293329  /tmp/research-lab.b64" | sha256sum --check
          base64 --decode /tmp/research-lab.b64 > /tmp/research-lab.zip
          echo "02848ad07881c614b386b24ad13f02632ed65934e32cff5b7c8a45b988054d3b  /tmp/research-lab.zip" | sha256sum --check
          unzip -qo /tmp/research-lab.zip -d .
          rm -rf .research-import

      - name: Verify frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build

      - name: Verify backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Strategy Research and Validation Lab"
          git push origin HEAD:feature/strategy-research-validation-lab
