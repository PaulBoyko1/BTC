name: Clean Interval Analyzer Transport

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-interval-transport.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove verified transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .interval-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .interval-import
          if git diff --cached --quiet; then
            echo "No transport files remain"
            exit 0
          fi
          git commit -m "Remove interval analyzer transport files"
          git push origin HEAD:${{ github.head_ref }}
