name: Strategy Research and Interval Analyzer CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "research.html"
      - "research.css"
      - "src/research.ts"
      - "dist/research.js"
      - "interval.html"
      - "interval.css"
      - "src/interval.ts"
      - "dist/interval.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/research-lab-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "research.html"
      - "research.css"
      - "src/research.ts"
      - "dist/research.js"
      - "interval.html"
      - "interval.css"
      - "src/interval.ts"
      - "dist/interval.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/research-lab-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app
