name: Clean Live Contract Edge UI Transport

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-edge-ui.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove transport payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .edge-ui
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .edge-ui
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove live contract edge UI transport"
          git push origin HEAD:${{ github.head_ref }}
