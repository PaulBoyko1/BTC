name: Import Regression Extreme Absorption

on:
  pull_request:
    branches: [main]
    paths:
      - ".rea-import/complete"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify transport chunks and reconstruct update
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rea-chunks.sha256 <<'EOF'
          b03d7f5ab9aebb202bab030593b784fb331aeee985bd9d57777ad0176159a05c  .rea-import/part-00
          6ef2b74e27531bd5f78ae038023b25a1185259d3eae8d16f65c07c9ca441310f  .rea-import/part-01
          acd123a80f74c73539f9d6b8e7c24205cb6ea72443fb1a565785702fc49bf70f  .rea-import/part-02
          6dd4c080686982d64b677bc1ee9c37ff9c78d605296eb78779ae65ab0e4c9d18  .rea-import/part-03-0
          d777de0f246daa1a3dba56ee3fb92e5487f9d88c80c1f32ed7210273096891c8  .rea-import/part-03-1
          d49949bce471ea2c62dd5ca92edd492a4ef508da20bbb286927c2ddae55fac37  .rea-import/part-03-2
          13c58dc5d3f19d8f06e308b04dcd620e06f943f52b620b91d982216a487cedec  .rea-import/part-04
          514d0c7c7b5305ba83327e472fed19adce67a4f503faad8e99b76914c8ba8980  .rea-import/part-05
          f0be342256ddbeb5f7a3ae12638bdde0075148ca36cc43530fcfebc69510ad39  .rea-import/part-06
          d62fd0998b323f87cad75ed0e81cdd4646e3d84f3424f0ae8ad129d64cf3904c  .rea-import/part-07
          ca07172b1fa93845f30a4e662053440510e1e19e486177e41ee1cba9c68f315d  .rea-import/part-08-0
          6fc15368180317c0f0fed48a9744d6b8c12ee7ffaaa3ce06bf1c0f41a8c6091c  .rea-import/part-08-1
          2e96befeaecfa916ff00067a74bf93e1c6f94da1f73cd10aedc8ae155950b067  .rea-import/part-08-2
          cc8923888e5efca156b1ece70d215badd6fdcbbcafa819101ee3cd63eb3c8e80  .rea-import/part-09-0
          09bbdbdb56b1ae30ad9bd92694be4723d4c269d54966abe426a968e1d8e78007  .rea-import/part-09-1
          dd121504bac5d91cbe82eb82a899fcbb4fcc06478d5a3c3d784ed94a27ec5d65  .rea-import/part-09-2
          4987154d65d408fb551451a694d8ea62260d46122eb47b518d5107da0b7f75fb  .rea-import/part-10-0
          7be63fe51e16967e3f0f58e63cdea866d8768759f7e73012e1c72a3b9d77b18c  .rea-import/part-10-1
          aabefbbdd477b67c8b28becd64edfcf57070a18fec94df5a3f1e1edf0610edb7  .rea-import/part-10-2
          14ac424295f93307659ce93ccf9b2a4c5f1f516d4cdb59bf8885d898e0c9462b  .rea-import/part-11-0
          a7639edbeeba1196fd8dea0443616dc331db213b281c7f34d170db99081f3a66  .rea-import/part-11-1
          1e7e586a1668cbb5f856488ad25fbdd182217ba6615c8e0c880a37567df25a9a  .rea-import/part-11-2
          50912244f0810899068b2100b093e9f0d59fdcfd8de8aefd645e733f9b5987f6  .rea-import/part-12
          EOF
          sha256sum --check /tmp/rea-chunks.sha256
          cat .rea-import/part-* | base64 --decode > /tmp/rea-update.zip
          echo "25d440acf3b9ec34921e05247f2cce66e7aa7d6ab1ed9fc80fae610d52ffc5c6  /tmp/rea-update.zip" | sha256sum --check
          unzip -qo /tmp/rea-update.zip -d .
          rm -rf .rea-import .github/workflows/import-regression-absorption.yml

      - name: Verify frontend
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build

      - name: Verify backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app

      - name: Commit verified module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Regression Extreme Absorption module"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
