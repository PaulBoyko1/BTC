name: Materialize Live Contract Edge UI

on:
  pull_request:
    branches: [main]
    paths:
      - ".edge-ui/**"
      - ".github/workflows/materialize-edge-ui.yml"

permissions:
  contents: write

jobs:
  verify-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and extract UI
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parts.sha256 <<'EOF'
          8381d2395b48387dcc10ceeef6c2f6b3b1bab91f8d3809e3dd7ecaaee2d43b6a  .edge-ui/part-00
          4ac7bbdaf9aab22512b0f28dd9cac654c487e6e668a256f9943d15e85e4e5ce6  .edge-ui/part-01
          059050715403965222decba1623cda72fd0b720f9d633e96973f39e491f0b6ea  .edge-ui/part-02
          4c9a54acd354908ba0497de4ab330e3c1729487f140eec2e2c9a03321af4dd9c  .edge-ui/part-03
          ee1761cde6578c44303803ba25cdad1866c27815f177b351f9e177907ae84175  .edge-ui/part-04
          EOF
          sha256sum --check /tmp/parts.sha256
          cat .edge-ui/part-* > /tmp/frontend-edge.b64x2
          echo "3f44775c68d48017ffdf0a6c89df7f2a2155f70cc92b288f3e0b4ae31ef537d0  /tmp/frontend-edge.b64x2" | sha256sum --check
          base64 --decode /tmp/frontend-edge.b64x2 > /tmp/frontend-edge.b64
          echo "6fd42b47559ffc168cf6f1a3fd9cd68d74d618990f1b73e88d0b6dba7ed408a2  /tmp/frontend-edge.b64" | sha256sum --check
          base64 --decode /tmp/frontend-edge.b64 > /tmp/frontend-edge.tar.xz
          echo "aacd5f452531300ee38a8699c73f180fde75f89551fd251e4c61fddbf9c2a2b1  /tmp/frontend-edge.tar.xz" | sha256sum --check
          tar -xJf /tmp/frontend-edge.tar.xz

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend/app

      - name: Commit verified UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/interval.ts dist/interval.js interval.css index.html interval.html
          git commit -m "Add fixed-expiry contract edge and preset interface"
          git push origin HEAD:${{ github.head_ref }}
