name: Import Crypto Pulse Analyzer

on:
  pull_request:
    branches: [main]
    paths:
      - ".archive/complete"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reconstruct and verify application archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .archive/part-00 \
            .archive/part-01 \
            .archive/part-02a-00 \
            .archive/part-02a-01 \
            .archive/part-02a-02 \
            .archive/part-02b \
            .archive/part-03-00 \
            .archive/part-03-01 \
            .archive/part-03-02 \
            .archive/part-03-03 \
            .archive/part-03-04 \
            | base64 --decode > .archive/crypto-pulse-source.zip
          echo "a21a588d9774abd0d3b6e153f3559cdf92bf281603dafe788612fe57268d6378  .archive/crypto-pulse-source.zip" | sha256sum --check
          unzip -qo .archive/crypto-pulse-source.zip -d .
          rm -rf .archive

      - name: Install and build application
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Commit imported application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Crypto Pulse BTC analyzer v2"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
