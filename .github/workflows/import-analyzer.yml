name: Import Crypto Pulse Analyzer

on:
  push:
    branches: [main]
    paths:
      - ".archive/complete"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and extract application
        shell: bash
        run: |
          set -euo pipefail
          cat .archive/part-* | base64 --decode > .archive/crypto-pulse-source.zip
          unzip -qo .archive/crypto-pulse-source.zip -d .
          rm -rf .archive

      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Commit imported application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Crypto Pulse BTC analyzer v2"
          git push
